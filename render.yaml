# Blueprint نشر تلقائي على Render — الخطة المجانية، منطقة فرانكفورت
# يُستخدم تلقائيًا عند: New + → Blueprint ← اختيار هذا المستودع
services:
  - type: web
    name: crypto-bot-v9
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python vnz.py"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # --- مفاتيح التداول (تُضبط يدويًا بعد أول نشر) ---
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      # --- قاعدة بيانات PostgreSQL (Neon أو Supabase المجانية) ---
      - key: DATABASE_URL
        sync: false
      # --- اختياري: Redis خارجي (Upstash). اتركه فارغًا لاستخدام البديل في الذاكرة ---
      - key: REDIS_URL
        sync: false
      # --- اختياري: إشعارات تليجرام ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # --- حماية لوحة التحكم (يوصى بشدة بضبطها) ---
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # --- إعدادات المخاطرة والفلاتر ---
      - key: DAILY_MAX_LOSS_USDT
        value: "20"
      - key: SIGNAL_GENERATION_LOOKBACK_DAYS
        value: "30"
      - key: MAX_OPEN_TRADES
        value: "5"
      - key: USE_HTF_CONFIRMATION
        value: "True"
      # --- [V9.9.1] حماية من حظر Binance (-1003): ميزانية تكيفية + تبريد استئناف ---
      # [V9.22.0] 1500→500: استهلاكنا الفعلي <2% من الميزانية — سقف متحفظ بلا أي كلفة
      - key: RATE_LIMIT_BUDGET_PER_MIN
        value: "500"
      - key: API_MIN_SPACING_SEC
        value: "0.15"
      - key: BAN_RESUME_COOLDOWN_SEC
        value: "90"
      - key: BAN_RESUME_RAMP_SEC
        value: "120"
      - key: PRICE_UPDATE_INTERVAL_SEC
        value: "3"
      # --- [V9.10] القائمة الديناميكية: العملات الأكثر حيوية (سيولة + تقلب + انفجارات) ---
      - key: USE_DYNAMIC_UNIVERSE
        value: "True"
      - key: DYNAMIC_UNIVERSE_SIZE
        value: "20"
      - key: DYNAMIC_UNIVERSE_REFRESH_MIN
        value: "30"
      - key: DYNAMIC_UNIVERSE_MIN_QUOTE_VOLUME
        value: "10000000"
      - key: DYNAMIC_UNIVERSE_MIN_RANGE_PCT
        value: "1.5"
      # --- [V9.25.0] دائرة الترشيح الموسعة: كون واسع 120 عملة + 10 عملات للفحص × كل استراتيجية
      # (العدد الكلي للفحص = 10 × عدد الاستراتيجيات — طلب المستخدم الصريح) ---
      - key: WIDE_UNIVERSE_SIZE
        value: "120"
      - key: NOMINEES_PER_STRATEGY
        value: "10"
      # --- [V9.10.1] منع اختناق خيوط الويب: كاش رصيد اللوحة بدل النداء المباشر ---
      - key: DASHBOARD_BALANCE_REFRESH_SEC
        value: "45"
      # --- [V9.11] بوصلة اتجاه BTC على الفريمات الثلاث (API مجاني، وزن 6/دقيقة) ---
      - key: BTC_TREND_REFRESH_SEC
        value: "60"
      # --- [V9.12] مهلة عميل Binance: تقطع النداءات المعلقة التي كانت تتجمد اللوحة ---
      - key: BINANCE_CLIENT_TIMEOUT_SEC
        value: "25"
      # --- [V9.13.0] خريطة القيادة: تصنيف العملات حسب القائد (BTC/ETH/SOL) وقرار حسب سلوكه ---
      - key: USE_LEADER_FILTER
        value: "True"
      - key: LEADER_CORR_WINDOW
        value: "192"
      - key: LEADER_CORR_MIN
        value: "0.30"
      - key: LEADER_BEARISH_SCORE
        value: "-18.0"
      - key: LEADER_REFRESH_SEC
        value: "300"
      # --- [V9.17.0] مطابقة الأزواج بالاستراتيجيات: ترشيح مخصص لكل استراتيجية ---
      - key: PAIR_MATCHING_ENABLED
        value: "True"
      - key: PAIR_MATCH_MIN_SCORE
        value: "45"
      - key: PAIR_POOL_DISPLAY_SIZE
        value: "8"
      # --- [V9.22.0] محرك الإدارة المثبت بالباك تيست (60 يومًا × 24 رمزًا: -85% ← +181%) ---
      - key: ATR_TRAIL_ACTIVATE_PROFIT_PCT
        value: "1.5"
      # --- [V9.23.0] محرك الأدلة: الترشيح بالبرهان لا بالتكهن (30 يومًا × 24 رمزًا × 53 ألف حدث:
      # خط الأساس -1.44U/PF 0.93 ← بوابة الأدلة + تهدئة 8 ساعات: +1.39U/PF 1.16، موجب في النصفين) ---
      - key: EVIDENCE_ENABLED
        value: "True"
      - key: RECOMMENDATION_COOLDOWN_MIN
        value: "480"
      - key: EVIDENCE_MIN_TRADES
        value: "5"
      - key: EVIDENCE_MIN_EXP_PCT
        value: "0.12"
      - key: EVIDENCE_MIN_PF
        value: "1.15"
      - key: EVIDENCE_REFRESH_MIN
        value: "240"
      # --- [V9.26.0] الحمايات — نمط Freqtrade (StoplossGuard/MaxDrawdown/LowProfitPairs/Cooldown) ---
      - key: PROTECTIONS_ENABLED
        value: "True"
      - key: PROTECTION_SL_COUNT
        value: "4"
      - key: PROTECTION_SL_LOOKBACK_MIN
        value: "240"
      - key: PROTECTION_SL_STOP_MIN
        value: "240"
      - key: PROTECTION_DD_MAX_PCT
        value: "12.0"
      - key: PROTECTION_DD_LOOKBACK_MIN
        value: "1440"
      - key: PROTECTION_DD_TRADE_LIMIT
        value: "5"
      - key: PROTECTION_DD_STOP_MIN
        value: "360"
      - key: PROTECTION_PAIR_TRADES
        value: "2"
      - key: PROTECTION_PAIR_LOOKBACK_MIN
        value: "720"
      - key: PROTECTION_PAIR_STOP_MIN
        value: "360"
      - key: PROTECTION_COOLDOWN_MIN
        value: "240"
      - key: MAX_SL_DISTANCE_PCT
        value: "6.0"
      - key: STALE_TRADE_HOURS
        value: "24.0"
      - key: STALE_MIN_PROFIT_PCT
        value: "0.2"
